<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TikTok</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main id="app">

    <section class="feed">

      <article class="video-card">
        <div class="video-placeholder">
          <div class="play">▶</div>
        </div>

        <div class="info">
          <div class="username">@tiktok</div>
          <div class="description">
            Здесь будет TikTok-лента 🔥
          </div>
          <div class="music">
            🎵 Оригинальный звук
          </div>
        </div>

        <div class="actions">
          <button>❤️</button>
          <button>💬</button>
          <button>↗️</button>
          <button>🔖</button>
        </div>
      </article>

    </section>

    <nav class="bottom-nav">
      <button class="active">
        <span>⌂</span>
        <small>Главная</small>
      </button>

      <button>
        <span>⌕</span>
        <small>Поиск</small>
      </button>

      <button class="add">
        <span>＋</span>
      </button>

      <button>
        <span>✉</span>
        <small>Входящие</small>
      </button>

      <button>
        <span>♙</span>
        <small>Профиль</small>
      </button>
    </nav>

  </main>

  <script src="/app.js"></script>

</body>
</html>
